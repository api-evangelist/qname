apis:
  - name: QName AI WHOIS REST API
    description: >-
      Approval-gated REST API for WHOIS/RDAP lookups: GET /api/whois/{domain} (single), POST /api/whois/batch (batch),
      and GET /api/domain-traffic (traffic). Requires an admin-approved API key (qname_ prefix) and enforces per-request
      and daily quotas.
