name: QName AI WHOIS API
description: >-
  QName AI (qname.ai) is a domain-research workspace whose WHOIS/RDAP capability is exposed programmatically through a
  small, approval-gated REST API and an agent-native CLI (@qname/cli). It offers authenticated single-domain and batch
  WHOIS/domain lookups plus a domain-traffic scope, consumable via the CLI, an installable Agent Skill, or direct REST
  calls.
